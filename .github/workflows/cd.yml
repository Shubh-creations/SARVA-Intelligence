name: AI Finance OS CD Pipeline

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-containers:
    name: Build & Push Production Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/financeos-backend:latest
            ghcr.io/${{ github.repository_owner }}/financeos-backend:${{ github.sha }}

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/financeos-frontend:latest
            ghcr.io/${{ github.repository_owner }}/financeos-frontend:${{ github.sha }}

  terraform-infrastructure-validation:
    name: Terraform Security & Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format & Validate
        working-directory: ./infra/terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate
