[tool.poetry]
name = "financeos-backend"
version = "0.1.0"
description = "FinanceOS platform API foundation"
authors = ["FinanceOS Engineering <engineering@financeos.example>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic-settings = "^2.7.0"
redis = "^5.2.1"
python-json-logger = "^3.2.1"
pyjwt = { extras = ["crypto"], version = "^2.10.1" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
httpx = "^0.28.1"
ruff = "^0.8.4"
black = "^24.10.0"
mypy = "^1.14.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["alembic"]
